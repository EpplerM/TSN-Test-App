apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tsn-test-app-daemon-set
  namespace: default
spec:
  selector:
    matchLabels:
      app: tsn-test-app-daemon-set
  template:
    metadata:
      labels:
        app: tsn-test-app-daemon-set
    spec:
      hostNetwork: true
      imagePullSecrets:
        - name: tsn-inn-registry-access
      containers:
        - name: tsn-agent
          image: cr.siemens.com/tsn-inn-de/es_to_es/es2es:v0.0.3
          tty: true # why do I have to set this? Otherwise log outputs are not visible
          command: ["./tsn_test_app"]
          args: ["-A", "-i", "enp2s0", "-s", "AL"]
          securityContext:
            # this should be removed as soon as we do not longer use raw sockets
            privileged: true
            capabilities:
              add:
                - NET_RAW
          resources:
            limits:
              cpu: 100m
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 200Mi

          ports:
            - containerPort: 65000
---
apiVersion: v1
kind: Service
metadata:
  name: tsn-test-app-daemon-set-service
  namespace: default
spec:
  selector:
    app: tsn-test-app-daemon-set
  ports:
    - port: 65000
